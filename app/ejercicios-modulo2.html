<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicios interactivos – Módulo 2</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#dde2ec;--acc:#2f5bea;--ok:#1a8f4c;--okbg:#e6f6ec;--ko:#c62828;--kobg:#fdeaea}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2b3446;--acc:#7b9bff;--ok:#5fd18c;--okbg:#14301f;--ko:#ff8a8a;--kobg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:1.15rem;margin:0}h1 span{color:var(--mute);font-weight:400}
.total{font-weight:600}
.layout{display:flex;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
nav{width:250px;flex:none}
nav h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
nav button.on{border-color:var(--acc);outline:2px solid var(--acc)}
nav .sc{font-weight:700;white-space:nowrap}
nav .sc.good{color:var(--ok)}nav .sc.bad{color:var(--ko)}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
main h2{margin:.1em 0 .2em;font-size:1.25rem}
.sub{color:var(--mute);white-space:pre-line}.ins{background:var(--bg);border-radius:8px;padding:8px 12px;margin:12px 0}
.q{border-top:1px solid var(--line);padding:12px 0}
.q.ok{background:var(--okbg)}.q.ko{background:var(--kobg)}
.q label{display:block;padding:3px 0;cursor:pointer}
.mark{font-weight:700;margin-left:6px}.ok .mark,.mark.ok{color:var(--ok)}.ko .mark,.mark.ko{color:var(--ko)}
select,input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--okbg)}input.ko{border-color:var(--ko);background:var(--kobg)}
.cloze{line-height:2.4;white-space:pre-line}.cloze input{width:9em}
table.match td{padding:6px 8px;vertical-align:top}
.grid{border-collapse:collapse;margin:12px 0}.grid td{width:30px;height:30px;padding:0;position:relative}
.grid td.cell{border:1px solid var(--ink);background:#fff}
.grid td.cell input{width:100%;height:100%;border:0;text-align:center;text-transform:uppercase;font-weight:700;color:#000;background:transparent;padding:0}
.grid td.cell.ok{background:#bdebd0}.grid td.cell.ko{background:#f6c4c4}
.grid .n{position:absolute;top:0;left:1px;font-size:9px;color:#444;pointer-events:none}
.clues{columns:2 280px;font-size:.9rem}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
button.p{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
.result{margin-top:14px;padding:12px;border-radius:8px;font-weight:600}
.result.good{background:var(--okbg);color:var(--ok)}.result.bad{background:var(--kobg);color:var(--ko)}
.fb{font-size:.88rem;color:var(--mute)}
.imgref{display:inline-block;margin:8px 0;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;font-size:.9rem}
@media(max-width:760px){.layout{flex-direction:column}nav{width:100%}}
.tag{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:1px}
.grid-wrap{overflow-x:auto;max-width:100%}
nav h2.part{font-size:.95rem;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}nav h2.part:first-child{border-top:0;padding-top:0;margin-top:0}
.tbl{overflow-x:auto;max-width:100%;margin:10px 0}.tbl table{border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left}.tbl th{background:var(--bg)}
</style>
</head>

 vida de las personas. Participa en la formación de sustancias importantes (ej vitamina D).", "answer": "COLESTEROL", "row": 11, "col": 0}, {"n": 12, "clue": "Tipo de biomolécula de la cual los triglicéridos son uno de los más frecuentes que se pueden enontrar en los seres vivos.", "answer": "LIPIDOS", "row": 11, "col": 11}, {"n": 13, "clue": "Biopolímeros que forman parte de los seres vivos. Están formados por átomos de carbono, hidrógeno, oxígeno, nitrógeno y azufre agrupados en unidades llamadas aminoácidos.", "answer": "PROTEINAS", "row": 13, "col": 5}, {"n": 14, "clue": "Monosacárido elaborado durante el proceso de fotosíntesis a partir de dióxido de carbono del aire y el agua, usando como fuente de energía la luz solar.", "answer": "GLUCOSA", "row": 17, "col": 12}], "down": [{"n": 1, "clue": "Lípidos que actúan como fuente de energía cuando las reservas de hidratos de carbono se acaban; aislantes de órganos y de tejidos; también las utiliza el organismo para disolver ciertas vitaminas como la vitamina A .", "answer": "TRIGLICERIDOS", "row": 0, "col": 1}, {"n": 3, "clue": "Disacárido utilizado para endulzar un té o para hacer postres.", "answer": "SACAROSA", "row": 0, "col": 17}, {"n": 6, "clue": "Proteína que forma gran parte de nuestras uñas, piel y pelo.", "answer": "QUERATINA", "row": 5, "col": 12}, {"n": 10, "clue": "Proteína principal de los cartílagos, ligamentos y tendones.", "answer": "COLAGENO", "row": 10, "col": 16}]}}, {"id": 27, "chapter": 6, "title": "COMPUESTOS ORGÁNICOS", "subtitle": "Indicar si las siguientes afirmaciones son verdaderas o falsas", "instructions": "Para cada frase selecciona VERDADERO o FALSO", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "Las sustancias orgánicas solo se pueden obtener a partir de organismos vivos.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}, {"type": "multichoice", "text": "En todas las sustancias orgánicas encontramos siempre presente átomos del elemento carbono.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "Correcto"}, {"text": "FALSO", "correct": false, "feedback": "Incorrecto"}]}, {"type": "multichoice", "text": "El tipo de unión química que predomina en las sustancias orgánicas es la iónica.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}, {"type": "multichoice", "text": "La propiedad particular del elemento carbono, que explica la existencia de gran cantidad de compuestos orgánicos, se llama concatenación.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "Correcto"}, {"text": "FALSO", "correct": false, "feedback": "Incorrecto"}]}, {"type": "multichoice", "text": "Los elementos biogenésicos son únicamente el carbono y el hidrógeno.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}]}}, {"id": 28, "chapter": 6, "title": "MOLÉCULAS ORGÁNICAS", "subtitle": "Ejercicio de opción múltiple", "instructions": "Para cada frase selecciona la única respuesta correcta", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "Todos los compuestos orgánicos contienen...", "answers": [{"text": "Oxígeno", "correct": false, "feedback": "No es correcto"}, {"text": "Fósforo", "correct": false, "feedback": "No es correcto"}, {"text": "Carbono", "correct": true, "feedback": "Correcto"}, {"text": "Nitrógeno", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "Los elementos llamados biogenésicos son...", "answers": [{"text": "C, H, S, N", "correct": false, "feedback": "No es correcto"}, {"text": "C, H, O, N", "correct": true, "feedback": "Correcto"}, {"text": "C, O, H, P", "correct": false, "feedback": "No es correcto"}, {"text": "C, H, Cl, O", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "En los compuestos orgánicos predomina la unión...", "answers": [{"text": "metálica", "correct": false, "feedback": "No es correcto"}, {"text": "covalente", "correct": true, "feedback": "Correcto"}, {"text": "iónica", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "Las sustancias orgánicas son compuestos...", "answers": [{"text": "termoestables", "correct": false, "feedback": "No es correcto"}, {"text": "se descomponen con facilidad", "correct": true, "feedback": "Correcto"}, {"text": "solubles en agua", "correct": false, "feedback": "No es correcto"}]}]}}, {"id": 29, "chapter": 6, "title": "COMBUSTIÓN", "subtitle": "Indicá si las siguientes afirmaciones son VERDADERAS o FALSAS", "instructions": "Para cada frase selecciona la única respuesta correcta", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "En una reacción de combustión los reactivos arden en presencia de dióxido de carbono.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Intento incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "¡Correcto!"}]}, {"type": "multichoice", "text": "Cuando una reacción de combustión se produce con escasa disponibilidad de oxígeno se obtiene como producto carbón, agua y energía.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "¡Correcto!"}, {"text": "FALSO", "correct": false, "feedback": "Intento incorrecto"}]}, {"type": "multichoice", "text": "Una reacción de combustión es completa cuando se produce con abundante disponibilidad de oxígeno.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "¡Correcto!"}, {"text": "FALSO", "correct": false, "feedback": "Intento incorrecto"}]}, {"type": "multichoice", "text": "Los productos que se obtienen en una combustión completa son agua y carbón (C).", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Intento incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "¡Correcto!"}]}]}}, {"id": 30, "chapter": 7, "title": "PRODUCTOS DE ORIGEN PETROQUÍMICO", "subtitle": "En la lista de materiales que se muestra a continuación indicá cuáles se obtienen del petróleo y cuáles no tienen origen petroquímico", "instructions": "Desplegá el menú y seleccioná la respuesta correcta", "type": "match", "images": [], "data": {"items": [{"left": "VIDRIO", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "SAL DE MESA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "PAPEL", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "ACEITES COMESTIBLES", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "GAS NATURAL", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "PLÁSTICOS", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "NAFTA", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "ARENA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "HARINA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "MÁRMOL", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "ACEITES LUBRICANTES", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "MADERA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "BARNIZ", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "ROCAS", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}], "options": ["NO SE OBTIENE DEL PETRÓLEO", "SE OBTIENE DEL PETRÓLEO"]}}, {"id": 31, "chapter": 7, "title": "COMBUSTIBLES FÓSILES", "subtitle": "Rellenar los espacios en blanco", "instructions": "Ubicá las palabras de la siguiente lista en los espacios en blanco. Luego presioná \"Comprobar respuesta\" para revisar tus respuestas. El botón \"Pista\" te dará una letra de la palabra. Tené en cuenta que las pistas te harán perder puntaje.\nRecordá colocar las tildes donde corresponda, de otro modo la palabra será tomada como incorrecta.", "type": "cloze", "images": [], "data": {"text": "El gas natural es un gas de aspecto {{1}} y su composición es 80 % {{2}}. Se formó hace {{3}} de años cuando una serie de {{4}} descompuestos quedaron sepultados bajo lodo y arena, en lo más profundo de antiguos lagos y {{5}}. En la medida que se acumulaba {{6}} , arena y sedimentos, se fueron formando capas de roca a gran {{7}} . La {{8}} causada por el peso sobre estas capas, más el calor de la Tierra, transformaron lentamente el material orgánico en {{9}} y en gas natural.\nEl petróleo crudo es un líquido aceitoso, inflamable, cuyo color varía de incoloro a {{10}} , su composición es un mezcla de {{11}} .\nEl carbón es un sólido de color negro cuya composición es {{12}} , hidrocarburos volátiles, azufre y {{13}} .", "gaps": [{"n": 1, "answers": ["incoloro"], "hint": ""}, {"n": 2, "answers": ["metano"], "hint": ""}, {"n": 3, "answers": ["millones"], "hint": ""}, {"n": 4, "answers": ["organismos", "seres vivos"], "hint": ""}, {"n": 5, "answers": ["océanos", "mares"], "hint": ""}, {"n": 6, "answers": ["lodo"], "hint": ""}, {"n": 7, "answers": ["profundidad"], "hint": ""}, {"n": 8, "answers": ["presión"], "hint": ""}, {"n": 9, "answers": ["petróleo crudo"], "hint": ""}, {"n": 10, "answers": ["negro"], "hint": ""}, {"n": 11, "answers": ["hidrocarburos"], "hint": ""}, {"n": 12, "answers": ["carbono"], "hint": ""}, {"n": 13, "answers": ["nitrógeno"], "hint": ""}], "caseSensitive": false, "wordList": ["carbono", "hidrocarburos", "incoloro", "lodo", "metano", "millones", "negro", "nitrógeno", "océanos", "organismos", "petróleo crudo", "presión", "profundidad"]}}, {"id": 201, "part": 2, "chapter": 3, "title": "PROPIEDADES DE LAS SUSTANCIAS IÓNICAS, COVALENTES Y METÁLICAS", "subtitle": "A partir de la información de la tabla sobre las sustancias P, Q, R, S y T, decidí cuál es iónica, cuál metálica y cuál covalente.", "instructions": "Para cada sustancia seleccioná la única respuesta correcta.", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "P es una sustancia", "explain": "No conduce en estado sólido pero sí fundida, y se disuelve en agua: es iónica.", "answers": [{"text": "Iónica", "correct": true}, {"text": "Covalente", "correct": false}, {"text": "Metálica", "correct": false}]}, {"type": "multichoice", "text": "Q es una sustancia", "explain": "Es un gas formado por moléculas, con punto de ebullición muy bajo: covalente.", "answers": [{"text": "Covalente", "correct": true}, {"text": "Iónica", "correct": false}, {"text": "Metálica", "correct": false}]}, {"type": "multichoice", "text": "R es una sustancia", "explain": "Conduce siempre la electricidad, es brillante y se puede laminar y estirar: metálica.", "answers": [{"text": "Metálica", "correct": true}, {"text": "Iónica", "correct": false}, {"text": "Covalente", "correct": false}]}, {"type": "multichoice", "text": "S es una sustancia", "explain": "Forma cristales, es una sal y conduce disuelta en agua: iónica.", "answers": [{"text": "Iónica", "correct": true}, {"text": "Covalente", "correct": false}, {"text": "Metálica", "correct": false}]}, {"type": "multichoice", "text": "T es una sustancia", "explain": "Líquido que no conduce la electricidad y está formado por moléculas: covalente.", "answers": [{"text": "Covalente", "correct": true}, {"text": "Iónica", "correct": false}, {"text": "Metálica", "correct": false}]}]}, "table": {"head": ["Sustancia", "Estado a temperatura ambiente", "¿Conduce la electricidad?", "Otras observaciones"], "rows": [["P", "Sólido", "No conduce sólida; sí cuando se funde", "Se disuelve en agua; puntos de fusión elevados"], ["Q", "Gas", "No", "Está formada por moléculas; punto de ebullición muy bajo"], ["R", "Sólido", "Sí, siempre", "Brillante; se puede laminar y estirar en hilos"], ["S", "Sólido", "No conduce sólida; sí disuelta en agua", "Forma cristales; es una sal"], ["T", "Líquido", "No", "Está formada por moléculas; punto de ebullición bajo"]]}}, {"id": 202, "part": 2, "chapter": 3, "title": "COMPUESTOS IÓNICOS, COVALENTES Y METÁLICOS", "subtitle": "Ejercicio de emparejamiento", "instructions": "Desplegá las opciones de la derecha y elegí la respuesta correcta.", "type": "match", "images": [], "data": {"items": [{"left": "a) Los átomos comparten electrones de a pares.", "correct": ["COMPUESTOS COVALENTES"]}, {"left": "b) Los cationes están sumergidos en una nube de electrones.", "correct": ["COMPUESTOS METÁLICOS"]}, {"left": "c) Se forman por la unión de un metal con un no metal.", "correct": ["COMPUESTOS IÓNICOS"]}, {"left": "d) Forman redes cristalinas de cationes y aniones.", "correct": ["COMPUESTOS IÓNICOS"]}, {"left": "e) Se unen únicamente átomos de no metales.", "correct": ["COMPUESTOS COVALENTES"]}, {"left": "f) Son maleables y dúctiles.", "correct": ["COMPUESTOS METÁLICOS"]}, {"left": "g) Conducen la electricidad cuando se funden o se disuelven en agua.", "correct": ["COMPUESTOS IÓNICOS"]}, {"left": "h) Salvo el mercurio, son sólidos a temperatura ambiente.", "correct": ["COMPUESTOS METÁLICOS"]}, {"left": "i) Forman moléculas; con átomos de carbono pueden formar macromoléculas.", "correct": ["COMPUESTOS COVALENTES"]}], "options": ["COMPUESTOS IÓNICOS", "COMPUESTOS COVALENTES", "COMPUESTOS METÁLICOS"]}}, {"id": 203, "part": 2, "chapter": 3, "title": "LA MOLÉCULA DE DIÓXIDO DE CARBONO", "subtitle": "El dióxido de carbono se representa O=C=O: el carbono comparte dos pares de electrones con cada átomo de oxígeno. Considerá esa información y contestá las preguntas.", "instructions": "Escribí la respuesta. Las tildes y las mayúsculas no cuentan.", "type": "quiz", "images": [], "data": {"questions": [{"type": "short", "text": "¿Cuántos átomos de oxígeno hay en la molécula?", "explain": "", "answers": [{"text": "2", "correct": true}, {"text": "dos", "correct": true}]}, {"type": "short", "text": "¿Cuántos átomos de carbono hay en la molécula?", "explain": "", "answers": [{"text": "1", "correct": true}, {"text": "uno", "correct": true}, {"text": "un", "correct": true}]}, {"type": "short", "text": "¿Cuál es la fórmula de este compuesto?", "explain": "Un carbono y dos oxígenos.", "answers": [{"text  "answers": ["anión", "anion"], "hint": ""}, {"n": 5, "answers": ["electrostática"], "hint": ""}, {"n": 6, "answers": ["cristalinas"], "hint": ""}, {"n": 7, "answers": ["disueltas", "disueltos", "disuelta", "en solución"], "hint": ""}, {"n": 8, "answers": ["comparten"], "hint": ""}, {"n": 9, "answers": ["moléculas"], "hint": ""}], "caseSensitive": false}}, {"id": 205, "part": 2, "chapter": 4, "title": "TIPOS DE COMPUESTOS QUÍMICOS", "subtitle": "", "instructions": "Para cada compuesto seleccioná la única opción correcta.", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "HCl", "explain": "Tiene hidrógeno unido a un no metal.", "answers": [{"text": "Ácido", "correct": true}, {"text": "Óxido", "correct": false}, {"text": "Base", "correct": false}, {"text": "Sal", "correct": false}]}, {"type": "multichoice", "text": "Mg(OH)₂", "explain": "Un metal unido a grupos oxhidrilo: hidróxido.", "answers": [{"text": "Base", "correct": true}, {"text": "Óxido", "correct": false}, {"text": "Ácido", "correct": false}, {"text": "Sal", "correct": false}]}, {"type": "multichoice", "text": "SO₃", "explain": "Binario de oxígeno con un no metal.", "answers": [{"text": "Óxido", "correct": true}, {"text": "Ácido", "correct": false}, {"text": "Base", "correct": false}, {"text": "Sal", "correct": false}]}, {"type": "multichoice", "text": "CaCO₃", "explain": "Metal unido a un grupo no metálico (carbonato).", "answers": [{"text": "Sal", "correct": true}, {"text": "Óxido", "correct": false}, {"text": "Ácido", "correct": false}, {"text": "Base", "correct": false}]}, {"type": "multichoice", "text": "H₂SO₄", "explain": "Hidrógeno unido a un no metal acompañado de oxígeno.", "answers": [{"text": "Ácido", "correct": true}, {"text": "Óxido", "correct": false}, {"text": "Base", "correct": false}, {"text": "Sal", "correct": false}]}, {"type": "multichoice", "text": "Na₂O", "explain": "Oxígeno unido a un metal.", "answers": [{"text": "Óxido", "correct": true}, {"text" ica"]}, {"left": "- pH 6,2", "correct": ["Solución ácida"]}, {"left": "- pH 7", "correct": ["Solución neutra"]}, {"left": "- pH 10", "correct": ["Solución básica"]}, {"left": "- pH 0,5", "correct": ["Solución ácida"]}], "options": ["Solución ácida", "Solución básica", "Solución neutra"]}}, {"id": 207, "part": 2, "chapter": 4, "title": "CONCEPTO DE pH", "subtitle": "", "instructions": "Seleccioná la única respuesta correcta.", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "El pH es una medida de…", "explain": "", "shuffle": true, "answers": [{"text": "la acidez, con valores de 0 a 14", "correct": true}, {"text": "la temperatura de una solución", "correct": false}, {"text": "la cantidad de agua de una solución", "correct": false}, {"text": "la densidad de una solución, de 0 a 100", "correct": false}]}, {"type": "multichoice", "text": "Una sustancia neutra tiene un pH…", "explain": "Ácidas: menor que 7. Básicas: mayor que 7.", "shuffle": true, "answers": [{"text": "igual a 7", "correct": true}, {"text": "menor que 7", "correct": false}, {"text": "mayor que 7", "correct": false}, {"text": "igual a 0", "correct": false}]}, {"type": "multichoice", "text": "¿Cuál de estas soluciones es la más ácida?", "explain": "Cuanto menor el pH, más ácida.", "shuffle": true, "answers": [{"text": "pH 2", "correct": true}, {"text": "pH 5", "correct": false}, {"text": "pH 7", "correct": false}, {"text": "pH 12", "correct": false}]}, {"type": "multichoice", "text": "¿Cuál de estas soluciones es la menos básica?", "explain": "Todas son básicas; la más cercana a 7 es la menos básica.", "shuffle": true, "answers": [{"text": "pH 8", "correct": true}, {"text": "pH 9", "correct": false}, {"text": "pH 10,5", "correct": false}, {"text": "pH 13,5", "correct": false}]}, {"type": "multichoice", "text": "¿Cuál es el instrumento de laboratorio que mide el pH?", "explain": "", "shuffle": true, "answers": [{"text": "El pH-metro", "correct": true}, {"text": "El termómetro", "correct": false}, {"text": "La probeta", "correct": false}, {"text": "El tubo de ensayo", "correct": false}]}, {"type": "multichoice", "text": "¿Qué indica la notación pH ∈ (7, 14]?", "explain": "El paréntesis excluye el 7.", "shuffle": true, "answers": [{"text": "Una sustancia básica", "correct": true}, {"text": "Una sustancia ácida", "correct": false}, {"text": "Una sustancia neutra", "correct": false}, {"text": "Una sustancia que no tiene pH", "correct": false}]}, {"type": "multichoice", "text": "¿Entre qué valores se recomienda que esté el pH de un líquido para no dañar la piel?", "explain": "", "shuffle": true, "answers": [{"text": "Entre 4 y 9", "correct": true}, {"text": "Entre 0 y 2", "correct": false}, {"text": "Entre 10 y 14", "correct": false}, {"text": "Solo exactamente 7", "correct": false}]}]}}, {"id": 208, "part": 2, "chapter": 4, "title": "INDICADORES ÁCIDO-BASE", "subtitle": "Rellenar los espacios en blanco", "instructions": "Completá las palabras que faltan. Las tildes y las mayúsculas no cuentan.", "type": "cloze", "images": [], "data": {"text": "1- El papel tornasol azul se pone de color {{1}} frente a un ácido.\n\n2- El papel tornasol rojo se pone de color {{2}} frente a una base.\n\n3- La fenolftaleína es incolora en medio {{3}} y se pone de color rojo grosella en medio {{4}}.\n\n4- Las sustancias que cambian de color según el pH se llaman {{5}}.", "gaps": [{"n": 1, "answers": ["rojo"], "hint": ""}, {"n": 2, "answers": ["azul"], "hint": ""}, {"n": 3, "answers": ["ácido", "acido", "ácida"], "hint": ""}, {"n": 4, "answers": ["básico", "alcalino", "básica", "basico"], "hint": ""}, {"n": 5, "answers": ["indicadores"], "hint": ""}], "caseSensitive": false}}, {"id": 209, "part": 2, "chapter": 4, "title": "ÓXIDOS, ÁCIDOS, BASES Y SALES", "subtitle": "Rellenar los espacios en blanco", "instructions": "Completá la palabra que falta. Las tildes y las mayúsculas no cuentan.", "type": "cloze", "images": [], "data": {"text": "1- Los óxidos son sustancias {{1}} formadas por oxígeno y otro elemento.\n\n2- El carácter ácido lo da la presencia de {{2}}.\n\n3- Las bases o hidróxidos tienen un metal unido a uno o más grupos {{3}}.\n\n4- El NaCl se llama cloruro de {{4}}.\n\n5- Cuando un ácido y una base reaccionan se forman una sal y {{5}}.\n\n6- La lluvia ácida se forma cuando los óxidos de {{6}} y de nitrógeno reaccionan con el agua y el oxígeno de la atmósfera.\n\n7- El ácido del vinagre es el ácido {{7}} y el de las gaseosas es el ácido {{8}}.", "gaps": [{"n": 1, "answers": ["binarias", "binarios"], "hint": ""}, {"n": 2, "answers": ["hidrógeno", "hidrogeno"], "hint": ""}, {"n": 3, "answers": ["oxhidrilo", "hidroxilo", "OH", "oxidrilo"], "hint": ""}, {"n": 4, "answers": ["sodio"], "hint": ""}, {"n": 5, "answers": ["agua"], "hint": ""}, {"n": 6, "answers": ["azufre"], "hint": ""}, {"n": 7, "answers": ["acético"], "hint": ""}, {"n": 8, "answers": ["carbónico"], "hint": ""}], "caseSensitive": false}}, {"id": 210, "part": 2, "chapter": 5, "title": "CLASIFICACIÓN DE REACCIONES QUÍMICAS", "subtitle": "Ejercicio de emparejamiento", "instructions": "Desplegá las opciones de la derecha y elegí la respuesta correcta.", "type": "match", "images": [], "data": {"items": [{"left": "a) Un ácido y una base reaccionan y se forman una sal y agua.", "correct": ["REACCIONES DE NEUTRALIZACIÓN"]}, {"left": "b) Varias sustancias sencillas se unen para formar una más compleja.", "correct": ["REACCIONES DE SÍNTESIS"]}, {"left": "c) Una sustancia compleja se transforma en dos o más sustancias más sencillas.", "correct": ["REACCIONES DE DESCOMPOSICIÓN"]}, {"left": "d) Absorben calor del ambiente.", "correct": ["REACCIONES ENDOTÉRMICAS"]}, {"left": "e) Liberan calor.", "correct": ["REACCIONES EXOTÉRMICAS"]}, {"left": "f) Transcurren en un solo sentido hasta que se consume el reactivo que está en defecto.", "correct": ["REACCIONES IRREVERSIBLES"]}, {"left": "g) Se representan con dos flechas de sentidos opuestos.", "correct": ["REACCIONES R };

// ---------- Renderers: each returns { node, check() -> {correct,total} } ----------
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function renderQuiz(ex) {
  const wrap = h('div'); const qs = [];
  ex.data.questions.forEach((q, qi) => {
    const box = h('div', { class: 'q' });
    const correctN = q.answers.filter(a => a.correct).length;
    const radio = q.type === 'multichoice' || (q.type === 'multiselect' && correctN === 1);
    box.append(h('div', {}, h('strong', {}, `${qi + 1}. `), q.text));
    let getOk, fb = h('div', { class: 'fb' });
    if (q.type === 'short') {
      const inp = h('input', { type: 'text', 'aria-label': `Respuesta ${qi + 1}` });
      box.append(inp);
      getOk = () => { const v = norm(inp.value); const hit = q.answers.find(a => a.correct && norm(a.text) === v); return !!hit; };
    } else {
      const labels = [];
      const inputs = q.answers.map((a, ai) => {
        const i = h('input', { type: radio ? 'radio' : 'checkbox', name: `q${ex.id}_${qi}` });
        labels.push(h('label', {}, i, ' ', a.text)); return i;
      });
      (q.shuffle ? shuffled(labels) : labels).forEach(l => box.append(l));
      getOk = () => q.answers.every((a, i) => inputs[i].checked === !!a.correct);
    }
    box.append(fb); qs.push({ box, getOk, q });
    wrap.append(box);
  });
  return { node: wrap, check() {
    let c = 0;
    qs.forEach(({ box, getOk, q }) => {
      const ok = getOk(); if (ok) c++; setMark(box, ok);
      const fb = box.querySelector('.fb');
      fb.textContent = ok ? '' : 'Respuesta correcta: ' + q.answers.filter(a => a.correct).map(a => a.text).join(' / ') + (q.explain ? ' — ' + q.explain : '');
    });
    return { correct: c, total: qs.length };
  } };
}

function renderMatch(ex) {
  const { items, options } = ex.data; const rows = [];
  const tb = h('tbody');
  items.forEach((it, i) => {
    const sel = h('select', { 'aria-label': it.left }, h('option', { value: '' }, '???'), options.map(o => h('option', { value: o }, o)));
    const mk = h('td');
    tb.append(h('tr', {}, h('td', {}, it.left), h('td', {}, sel), mk));
    rows.push({ it, sel, mk });
  });
  return { node: h('table', { class: 'match' }, tb), check() {
    let c = 0;
    rows.forEach(({ it, sel, mk }) => {
      const ok = it.correct.includes(sel.value); if (ok) c++;
      mk.textContent = ok ? '✔' : '✘ Correcta: ' + it.correct.join(' / '); mk.className = 'mark ' + (ok ? 'ok' : 'ko');
    });
    return { correct: c, total: rows.length };
  } };
}

function renderCloze(ex) {
  const { text, gaps, caseSensitive, wordList } = ex.data; const fields = [];
  const box = h('div', { class: 'cloze' });
  text.split(/(\{\{\d+\}\})/).forEach(part => {
    const m = part.match(/^\{\{(\d+)\}\}$/);
    if (!m) { box.append(part); return; }
    const gap = gaps.find(g => g.n === +m[1]);
    const inp = h('input', { type: 'text', 'aria-label': `Hueco ${gap.n}`, title: gap.hint || '', autocomplete: 'off' });
    const rv = h('span', { class: 'fb' }); fields.push({ inp, gap, rv }); box.append(inp, rv);
  });
  const node = h('div');
  if (wordList && wordList.length) node.append(h('p', { class: 'fb' }, 'Palabras: ' + wordList.join(' · ')));
  node.append(box);
  return { node, check() {
    let c = 0;
    fields.forEach(({ inp, gap, rv }) => {
      const ok = gap.answers.some(a => norm(a) === norm(inp.value));
      if (ok) c++; setMark(inp, ok);
      rv.textContent = ok ? '' : ' → ' + gap.answers.join(' / ');
    });
    return { correct: c, total: fields.length };
  } };
}

function renderCross(ex) {
  const { grid, across, down } = ex.data;
  const tb = h('tbody'); const inputs = {};
  const nums = {};
  [...across, ...down].forEach(w => { nums[w.row + ',' + w.col] = w.n; });
  grid.forEach((row, r) => {
    const tr = h('tr');
    row.forEach((ch, c) => {
      if (!ch) { tr.append(h('td')); return; }
      const inp = h('input', { type: 'text', maxlength: 1, 'aria-label': `Fila ${r + 1}, columna ${c + 1}` });
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase(); });
      const td = h('td', { class: 'cell' }, inp);
      if (nums[r + ',' + c]) td.append(h('span', { class: 'n' }, String(nums[r + ',' + c])));
      inputs[r + ',' + c] = { td, inp, ch }; tr.append(td);
    });
    tb.append(tr);
  });
  const clues = (title, list) => h('div', {}, h('h4', {}, title), h('ol', { class: 'clues' }, list.map(w => h('li', { value: w.n }, w.clue))));
  const rvx = h('div', { class: 'fb' });
  const node = h('div', {}, rvx, h('div', { class: 'grid-wrap' }, h('table', { class: 'grid' }, tb)), clues('Horizontales', across), clues('Verticales', down));
  const words = [...across.map(w => ({ ...w, dr: 0, dc: 1 })), ...down.map(w => ({ ...w, dr: 1, dc: 0 }))];
  return { node, check() {
    let c = 0; const bad = new Set(); const miss = [];
    words.forEach(w => {
      const cells = [...w.answer].map((_, i) => inputs[(w.row + w.dr * i) + ',' + (w.col + w.dc * i)]);
      const ok = cells.every((x, i) => x && x.inp.value.toUpperCase() === w.answer[i]);
      if (ok) c++; else { miss.push(w.n + (w.dr ? '↓ ' : '→ ') + w.answer); cells.forEach(x => x && bad.add(x)); }
    });
    Object.values(inputs).forEach(x => { x.td.classList.remove('ok', 'ko'); x.td.classList.add(bad.has(x) ? 'ko' : (x.inp.value ? 'ok' : 'ko')); });
    rvx.textContent = miss.length ? 'Respuestas correctas de las palabras falladas: ' + miss.join(' · ') : '';
    return { correct: c, total: words.length };
  } };
}

const RENDER = { quiz: renderQuiz, match: renderMatch, cloze: renderCloze, cross: renderCross };

// ---------- Scoring ----------
// Puntaje = (aciertos − intentos fallidos previos) / total × 100, como en Hot Potatoes.
function scoreOf(correct, total, fails) { return Math.max(0, Math.round(100 * (correct - fails) / total)); }
const cls = s => s >= 80 ? 'good' : s < 50 ? 'bad' : '';

// ---------- UI ----------
let currentId = EX[0].id;
const partOf = ex => ex.part || 1;
const numOf = ex => partOf(ex) === 2 ? ex.id - 200 : ex.id;
function renderMenu() {
  const menu = $('#menu'); menu.replaceChildren();
  let key = null;
  EX.forEach(ex => {
    const k = partOf(ex) + ':' + ex.chapter;
    if (k !== key) {
      if (!key || key.split(':')[0] !== String(partOf(ex))) menu.append(h('h2', { class: 'part' }, partOf(ex) === 1 ? 'Parte 1 · Ejercicios de la guía' : 'Parte 2 · Ejercicios nuevos'));
      key = k; menu.append(h('h3', {}, `Capítulo ${ex.chapter}`));
    }
    const p = progress[ex.id];
    menu.append(h('button', { class: ex.id === currentId ? 'on' : '', 'data-id': ex.id, onclick: () => { currentId = ex.id; show(); } },
      h('span', {}, `${numOf(ex)}. ${ex.title}`),
      h('span', { class: 'sc ' + (p ? cls(p.best) : '') }, p ? p.best + '%' : '–')));
  });
}
function renderTotal() {
  const avgOf = l => Math.round(l.reduce((a, e) => a + (progress[e.id]?.best || 0), 0) / l.length);
  const parts = [1, 2].map(n => EX.filter(e => partOf(e) === n));
  const t = $('#total');
  t.textContent = `Parte 1: ${avgOf(parts[0])}% (${parts[0].filter(e => progress[e.id]).length}/${parts[0].length}) · Parte 2: ${avgOf(parts[1])}% (${parts[1].filter(e => progress[e.id]).length}/${parts[1].length})`;
  const chs = [...new Set(EX.map(e => partOf(e) + ':' + e.chapter))];
  t.title = chs.map(k => { const [pt, c] = k.split(':'); return `P${pt} cap. ${c}: ${avgOf(EX.filter(e => partOf(e) === +pt && e.chapter === +c))}%`; }).join('  |  ');
}
function show() {
  const ex = EX.find(e => e.id === currentId); const main = $('#main'); main.replaceChildren();
  let fails = 0, locked = false;
  const r = RENDER[ex.type](ex);
  const res = h('div', { 'aria-live': 'polite' });
  const prog = progress[ex.id];
  main.append(h('h2', {}, `${partOf(ex) === 2 ? 'Parte 2 · ' : ''}Ejercicio ${numOf(ex)} · ${ex.title}`));
  if (ex.subtitle) main.append(h('p', { class: 'sub' }, ex.subtitle));
  (ex.images || []).forEach(f => {
    const img = h('img', { src: 'images/' + encodeURIComponent(f), alt: f, style: 'max-width:100%;display:block;margin:8px 0' });
    img.addEventListener('error', () => img.replaceWith(h('a', { class: 'imgref', href: IMG_LINKS[f] || '#', target: '_blank', rel: 'noopener' }, '🖼 Ver imagen del ejercicio: ' + f)));
    main.append(img);
  });
  if (ex.table) main.append(h('div', { class: 'tbl' }, h('table', {}, h('thead', {}, h('tr', {}, ex.table.head.map(x => h('th', {}, x)))), h('tbody', {}, ex.table.rows.map(r => h('tr', {}, r.map(x => h('td', {}, x))))))));
  if (ex.instructions) main.append(h('div', { class: 'ins' }, ex.instructions));
  main.append(r.node);
  const check = h('button', { class: 'p', onclick: () => {
    if (locked) return;
    const { correct, total } = r.check();
    const score = scoreOf(correct, total, ex.noPenalty ? 0 : fails);
    const p = progress[ex.id] || { best: 0, attempts: 0 };
    p.attempts++; p.last = score; p.best = Math.max(p.best, score); progress[ex.id] = p; save();
    const all = correct === total;
    res.replaceChildren(h('div', { class: 'result ' + (all ? 'good' : 'bad') },
      `Correctas: ${correct}/${total} · Puntaje: ${score}%` + (fails && !ex.noPenalty ? ` (−${fails} por intentos fallidos)` : '') +
      (all ? ' — ¡Correcto! Bien hecho.' : ' — Hay respuestas incorrectas, marcadas con ✘. Inténtalo nuevamente.')));
    if (all) { locked = true; check.disabled = true; } else fails++;
    renderMenu(); renderTotal();
  } }, 'Comprobar respuestas');
  const retry = h('button', { class: 's', onclick: show }, 'Reiniciar ejercicio');
  main.append(h('div', { class: 'actions' }, check, retry,
    prog ? h('span', { class: 'fb' }, `Mejor puntaje: ${prog.best}% · Intentos: ${prog.attempts}`) : ''), res);
  renderMenu();
}
const reset = h('button', { class: 's', onclick: () => { if (confirm('¿Borrar todo el progreso?')) { progress = {}; save(); show(); renderTotal(); } } }, 'Borrar progreso');
document.querySelector('.top').append(reset);
renderTotal(); show();
})();
</script>
