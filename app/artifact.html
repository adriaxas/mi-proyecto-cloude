<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#dde2ec;--acc:#2f5bea;--ok:#1a8f4c;--okbg:#e6f6ec;--ko:#c62828;--kobg:#fdeaea;--cell:#fff;--cellink:#111}

*{box-sizing:border-box}
body{margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.top{margin-inline:-16px;padding-inline:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;margin:0}h1 span{color:var(--mute);font-weight:400}
.total{font-weight:600}
.layout{display:flex;gap:16px;max-width:1100px;margin:0 auto;padding-block:16px}
nav{width:250px;flex:none}
nav h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
nav button.on{border-color:var(--acc);outline:2px solid var(--acc)}
nav .sc{font-weight:700;white-space:nowrap}
nav .sc.good{color:var(--ok)}nav .sc.bad{color:var(--ko)}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
main h2{margin:.1em 0 .2em;font-size:1.25rem}
.sub{color:var(--mute);white-space:pre-line}.ins{background:var(--bg);border-radius:8px;padding:8px 12px;margin:12px 0}
.q{border-top:1px solid var(--line);padding:12px 0}
.q.ok{background:var(--okbg)}.q.ko{background:var(--kobg)}
.q label{display:block;padding:3px 0;cursor:pointer}
.mark{font-weight:700;margin-left:6px}.ok .mark,.mark.ok{color:var(--ok)}.ko .mark,.mark.ko{color:var(--ko)}
select,input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--okbg)}input.ko{border-color:var(--ko);background:var(--kobg)}
.cloze{line-height:2.4;white-space:pre-line}.cloze input{width:9em}
table.match td{padding:6px 8px;vertical-align:top}
.grid{border-collapse:collapse;margin:12px 0}.grid td{width:30px;height:30px;padding:0;position:relative}
.grid td.cell{border:1px solid var(--mute);background:var(--cell)}
.grid td.cell input{width:100%;height:100%;border:0;text-align:center;text-transform:uppercase;font-weight:700;color:var(--cellink);background:transparent;padding:0}
.grid td.cell.ok{background:var(--okbg)}.grid td.cell.ko{background:var(--kobg)}
.grid .n{position:absolute;top:0;left:1px;font-size:9px;color:var(--mute);pointer-events:none}
.clues{columns:2 280px;font-size:.9rem}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
button.p{background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
.result{margin-top:14px;padding:12px;border-radius:8px;font-weight:600}
.result.good{background:var(--okbg);color:var(--ok)}.result.bad{background:var(--kobg);color:var(--ko)}
.fb{font-size:.88rem;color:var(--mute)}
.imgref{display:inline-block;margin:8px 0;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;font-size:.9rem}
@media(max-width:760px){.layout{flex-direction:column}nav{width:100%}}
.tag{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:1px}
.grid-wrap{overflow-x:auto;max-width:100%}
</style>

 vida de las personas. Participa en la formación de sustancias importantes (ej vitamina D).", "answer": "COLESTEROL", "row": 11, "col": 0}, {"n": 12, "clue": "Tipo de biomolécula de la cual los triglicéridos son uno de los más frecuentes que se pueden enontrar en los seres vivos.", "answer": "LIPIDOS", "row": 11, "col": 11}, {"n": 13, "clue": "Biopolímeros que forman parte de los seres vivos. Están formados por átomos de carbono, hidrógeno, oxígeno, nitrógeno y azufre agrupados en unidades llamadas aminoácidos.", "answer": "PROTEINAS", "row": 13, "col": 5}, {"n": 14, "clue": "Monosacárido elaborado durante el proceso de fotosíntesis a partir de dióxido de carbono del aire y el agua, usando como fuente de energía la luz solar.", "answer": "GLUCOSA", "row": 17, "col": 12}], "down": [{"n": 1, "clue": "Lípidos que actúan como fuente de energía cuando las reservas de hidratos de carbono se acaban; aislantes de órganos y de tejidos; también las utiliza el organismo para disolver ciertas vitaminas como la vitamina A .", "answer": "TRIGLICERIDOS", "row": 0, "col": 1}, {"n": 3, "clue": "Disacárido utilizado para endulzar un té o para hacer postres.", "answer": "SACAROSA", "row": 0, "col": 17}, {"n": 6, "clue": "Proteína que forma gran parte de nuestras uñas, piel y pelo.", "answer": "QUERATINA", "row": 5, "col": 12}, {"n": 10, "clue": "Proteína principal de los cartílagos, ligamentos y tendones.", "answer": "COLAGENO", "row": 10, "col": 16}]}}, {"id": 27, "chapter": 6, "title": "COMPUESTOS ORGÁNICOS", "subtitle": "Indicar si las siguientes afirmaciones son verdaderas o falsas", "instructions": "Para cada frase selecciona VERDADERO o FALSO", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "Las sustancias orgánicas solo se pueden obtener a partir de organismos vivos.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}, {"type": "multichoice", "text": "En todas las sustancias orgánicas encontramos siempre presente átomos del elemento carbono.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "Correcto"}, {"text": "FALSO", "correct": false, "feedback": "Incorrecto"}]}, {"type": "multichoice", "text": "El tipo de unión química que predomina en las sustancias orgánicas es la iónica.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}, {"type": "multichoice", "text": "La propiedad particular del elemento carbono, que explica la existencia de gran cantidad de compuestos orgánicos, se llama concatenación.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "Correcto"}, {"text": "FALSO", "correct": false, "feedback": "Incorrecto"}]}, {"type": "multichoice", "text": "Los elementos biogenésicos son únicamente el carbono y el hidrógeno.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "Correcto"}]}]}}, {"id": 28, "chapter": 6, "title": "MOLÉCULAS ORGÁNICAS", "subtitle": "Ejercicio de opción múltiple", "instructions": "Para cada frase selecciona la única respuesta correcta", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "Todos los compuestos orgánicos contienen...", "answers": [{"text": "Oxígeno", "correct": false, "feedback": "No es correcto"}, {"text": "Fósforo", "correct": false, "feedback": "No es correcto"}, {"text": "Carbono", "correct": true, "feedback": "Correcto"}, {"text": "Nitrógeno", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "Los elementos llamados biogenésicos son...", "answers": [{"text": "C, H, S, N", "correct": false, "feedback": "No es correcto"}, {"text": "C, H, O, N", "correct": true, "feedback": "Correcto"}, {"text": "C, O, H, P", "correct": false, "feedback": "No es correcto"}, {"text": "C, H, Cl, O", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "En los compuestos orgánicos predomina la unión...", "answers": [{"text": "metálica", "correct": false, "feedback": "No es correcto"}, {"text": "covalente", "correct": true, "feedback": "Correcto"}, {"text": "iónica", "correct": false, "feedback": "No es correcto"}]}, {"type": "multichoice", "text": "Las sustancias orgánicas son compuestos...", "answers": [{"text": "termoestables", "correct": false, "feedback": "No es correcto"}, {"text": "se descomponen con facilidad", "correct": true, "feedback": "Correcto"}, {"text": "solubles en agua", "correct": false, "feedback": "No es correcto"}]}]}}, {"id": 29, "chapter": 6, "title": "COMBUSTIÓN", "subtitle": "Indicá si las siguientes afirmaciones son VERDADERAS o FALSAS", "instructions": "Para cada frase selecciona la única respuesta correcta", "type": "quiz", "images": [], "data": {"questions": [{"type": "multichoice", "text": "En una reacción de combustión los reactivos arden en presencia de dióxido de carbono.", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Intento incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "¡Correcto!"}]}, {"type": "multichoice", "text": "Cuando una reacción de combustión se produce con escasa disponibilidad de oxígeno se obtiene como producto carbón, agua y energía.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "¡Correcto!"}, {"text": "FALSO", "correct": false, "feedback": "Intento incorrecto"}]}, {"type": "multichoice", "text": "Una reacción de combustión es completa cuando se produce con abundante disponibilidad de oxígeno.", "answers": [{"text": "VERDADERO", "correct": true, "feedback": "¡Correcto!"}, {"text": "FALSO", "correct": false, "feedback": "Intento incorrecto"}]}, {"type": "multichoice", "text": "Los productos que se obtienen en una combustión completa son agua y carbón (C).", "answers": [{"text": "VERDADERO", "correct": false, "feedback": "Intento incorrecto"}, {"text": "FALSO", "correct": true, "feedback": "¡Correcto!"}]}]}}, {"id": 30, "chapter": 7, "title": "PRODUCTOS DE ORIGEN PETROQUÍMICO", "subtitle": "En la lista de materiales que se muestra a continuación indicá cuáles se obtienen del petróleo y cuáles no tienen origen petroquímico", "instructions": "Desplegá el menú y seleccioná la respuesta correcta", "type": "match", "images": [], "data": {"items": [{"left": "VIDRIO", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "SAL DE MESA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "PAPEL", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "ACEITES COMESTIBLES", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "GAS NATURAL", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "PLÁSTICOS", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "NAFTA", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "ARENA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "HARINA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "MÁRMOL", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "ACEITES LUBRICANTES", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "MADERA", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}, {"left": "BARNIZ", "correct": ["SE OBTIENE DEL PETRÓLEO"]}, {"left": "ROCAS", "correct": ["NO SE OBTIENE DEL PETRÓLEO"]}], "options": ["NO SE OBTIENE DEL PETRÓLEO", "SE OBTIENE DEL PETRÓLEO"]}}, {"id": 31, "chapter": 7, "title": "COMBUSTIBLES FÓSILES", "subtitle": "Rellenar los espacios en blanco", "instructions": "Ubicá las palabras de la siguiente lista en los espacios en blanco. Luego presioná \"Comprobar respuesta\" para revisar tus respuestas. El botón \"Pista\" te dará una letra de la palabra. Tené en cuenta que las pistas te harán perder puntaje.\nRecordá colocar las tildes donde corresponda, de otro modo la palabra será tomada como incorrecta.", "type": "cloze", "images": [], "data": {"text": "El gas natural es un gas de aspecto {{1}} y su composición es 80 % {{2}}. Se formó hace {{3}} de años cuando una serie de {{4}} descompuestos quedaron sepultados bajo lodo y arena, en lo más profundo de antiguos lagos y {{5}}. En la medida que se acumulaba {{6}} , arena y sedimentos, se fueron formando capas de roca a gran {{7}} . La {{8}} causada por el peso sobre estas capas, más el calor de la Tierra, transformaron lentamente el material orgánico en {{9}} y en gas natural.\nEl petróleo crudo es un líquido aceitoso, inflamable, cuyo color varía de incoloro a {{10}} , su composición es un mezcla de {{11}} .\nEl carbón es un sólido de color negro cuya composición es {{12}} , hidrocarburos volátiles, azufre y {{13}} .", "gaps": [{"n": 1, "answers": ["incoloro"], "hint": ""}, {"n": 2, "answers": ["metano"], "hint": ""}, {"n": 3, "answers": ["millones"], "hint": ""}, {"n": 4, "answers": ["organismos", "seres vivos"], "hint": ""}, {"n": 5, "answers": ["océanos", "mares"], "hint": ""}, {"n": 6, "answers": ["lodo"], "hint": ""}, {"n": 7, "answers": ["profundidad"], "hint": ""}, {"n": 8, "answers": ["presión"], "hint": ""}, {"n": 9, "answers": ["petróleo crudo"], "hint": ""}, {"n": 10, "answers": ["negro"], "hint": ""}, {"n": 11, "answers": ["hidrocarburos"], "hint": ""}, {"n": 12, "answers": ["carbono"], "hint": ""}, {"n": 13, "answers": ["nitrógeno"], "hint": ""}], "caseSensitive": false, "wordList": ["carbono", "hidrocarburos", "incoloro", "lodo", "metano", "millones", "negro", "nitrógeno", "océanos", "organismos", "petróleo crudo", "presión", "profundidad"]}}, {"id": 101, "chapter": 99, "type": "quiz", "title": "Examen de refuerzo: preguntas mezcladas", "noPenalty": true, "subtitle": "Mezcla de opción múltiple, verdadero o falso y completar. Los temas son los que más se fallaron en las prácticas.", "instructions": "En completar escribí el término técnico (la tilde y las mayúsculas no cuentan). Al comprobar vas a ver la respuesta correcta y una explicación.", "images": [], "data": {"questions": [{"type": "multichoice", "shuffle": true, "text": "El ozono (O₃) es…", "explain": "Aunque tenga 3 átomos, todos son del mismo elemento: oxígeno.", "answers": [{"text": "una sustancia simple", "correct": true}, {"text": "una sustancia compuesta", "correct": false}, {"text": "una solución", "correct": false}, {"text": "una mezcla heterogénea", "correct": false}], "id": 1}, {"type": "multichoice", "shuffle": true, "text": "Una reacción irreversible continúa hasta que…", "explain": "", "answers": [{"text": "se consume por completo el reactivo que está en defecto", "correct": true}, {"text": "se iguala la cantidad de reactivos y de productos", "correct": false}, {"text": "los productos reaccionan entre sí y regeneran los reactivos", "correct": false}, {"text": "se acaba la energía del ambiente", "correct": false}], "id": 2}, {"type": "multichoice", "text": "La glucosa y la sacarosa se disuelven en agua.", "explain": "Monosacáridos y disacáridos son solubles.", "answers": [{"text": "VERDADERO", "correct": true}, {"text": "FALSO", "correct": false}], "id": 3}, {"type": "multichoice", "text": "En la molécula de nitrógeno (N₂), los átomos comparten tres pares de electrones.", "explain": "Triple enlace covalente.", "answers": [{"text": "VERDADERO", "correct": true}, {"text": "FALSO", "correct": false}], "id": 4}, {"type": "multichoice", "text": "La reacción HCl + NaOH → NaCl + H₂O es una reacción de síntesis.", "explain": "Es de neutralización: dos sustancias que se reordenan, no se unen en una sola.", "answers": [{"text": "VERDADERO", "correct": false}, {"text": "FALSO", "correct": true}], "id": 5}, {"type": "multichoice", "shuffle": true, "text": "¿Qué biomolécula contiene fósforo (P) además de C, H, O y N?", "explain": "Las proteínas llevan C, H, O, N (a veces S); lípidos y glúcidos, C, H y O.", "answers": [{"text": "Los ácidos nucleicos", "correct": true}, {"text": "Las proteínas", "correct": false}, {"text": "Los lípidos", "correct": false}, {"text": "Los glúcidos", "correct": false}], "id": 6}, {"type": "short", "text": "Una dispersión de partículas sólidas en un líquido, como el agua de río con barro, es una ______.", "explain": "", "answers": [{"text": "suspensión", "correct": true}], "id": 7}, {"type": "multichoice", "text": "La masa y el volumen de una muestra son propiedades extensivas.", "explain": "", "answers": [{"text": "VERDADERO", "correct": true}, {"text": "FALSO", "correct": false}], "id": 8}, {"type": "multichoice", "shuffle": true, "text": "Al quemar completamente propano (C₃H₈) con suficiente oxígeno, los productos son…", "explain": "Combustión completa: dióxido de carbono + agua.", "answers": [{"text": "CO₂ y H₂O", "correct": true}, {"text": "CO y H₂O", "correct": false}, {"text": "C y H₂O", "correct": false}, {"text": "CO₂ y H₂", "correct": false}], "id": 9}, {"type": "short", "text": "Un brasero en un ambiente cerrado produce, por combustión incompleta, el gas tóxico ______.", "explain": "Monóxido (un oxígeno) ≠ dióxido (dos oxígenos).", "answers": [{"text": "monóxido de carbono", "correct": true}, {"text": "CO", "correct": true}], "id": 10}, {"type": "short", "text": "El recipiente de fondo plano y cuello largo para preparar soluciones de concentración exacta es el matraz ______.", "explain": "El Erlenmeyer es cónico y no sirve para medir volumen exacto.", "answers": [{"text": "aforado", "correct": true}], "id": 11}, {"type": "multichoice", "shuffle": true, "text": "El magnesio (Mg) tiene 2 electrones en su último nivel. Para parecerse al neón tiende a…", "explain": "Al perder electrones queda con carga positiva: catión.", "answers": [{"text": "perder 2 electrones y formar un catión", "correct": true}, {"text": "ganar 6 electrones", "correct": false}, {"text": "perder 2 electrones y formar un anión", "correct": false}, {"text": "compartir 2 electrones con el neón", "correct": false}], "id": 12}, {"type": "multichoice", "shuffle": true, "text": "¿Por qué conviene no cocinar demasiado los alimentos con vitamina C?", "explain": "", "answers": [{"text": "Es hidrosoluble y se destruye con la cocción", "correct" <script>
(() => {
'use strict';
const EX = window.EXERCISES;
const KEY = 'modulo2-progreso-v1';
const IMG_LINKS = {
  'ej cap 3 17 PropCompuestos.jpg': 'https://drive.google.com/file/d/1WV2570vHZ2JKUD9LYktOuRs-Z2v7vX5q/view',
  'ozono.jpg': 'https://drive.google.com/file/d/1EyPSDeEI1e7Cq1-bWaphESJ_JBMF3KkV/view'
};
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} };

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k));
  return el;
}
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toLowerCase();
const setMark = (el, ok) => {
  el.classList.remove('ok', 'ko'); el.classList.add(ok ? 'ok' : 'ko');
  const old = el.querySelector(':scope > .mark'); if (old) old.remove();
  if (!el.matches('input,td')) el.append(h('span', { class: 'mark' }, ok ? '✔' : '✘'));
};

// ---------- Renderers: each returns { node, check() -> {correct,total} } ----------
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function renderQuiz(ex) {
  const wrap = h('div'); const qs = [];
  ex.data.questions.forEach((q, qi) => {
    const box = h('div', { class: 'q' });
    const correctN = q.answers.filter(a => a.correct).length;
    const radio = q.type === 'multichoice' || (q.type === 'multiselect' && correctN === 1);
    const isVF = q.answers.length === 2 && q.answers[0].text === 'VERDADERO';
    const tag = q.type === 'short' ? 'Completar' : isVF ? 'Verdadero o falso' : q.type === 'multichoice' || correctN === 1 ? 'Opción múltiple' : 'Selección';
    box.append(h('div', {}, h('strong', {}, `${qi + 1}. `), ex.id === 101 ? h('span', { class: 'tag' }, tag) : '', q.text));
    let getOk, fb = h('div', { class: 'fb' });
    if (q.type === 'short') {
      const inp = h('input', { type: 'text', 'aria-label': `Respuesta ${qi + 1}` });
      box.append(inp);
      getOk = () => { const v = norm(inp.value); const hit = q.answers.find(a => a.correct && norm(a.text) === v); return !!hit; };
    } else {
      const labels = [];
      const inputs = q.answers.map((a, ai) => {
        const i = h('input', { type: radio ? 'radio' : 'checkbox', name: `q${ex.id}_${qi}` });
        labels.push(h('label', {}, i, ' ', a.text)); return i;
      });
      (q.shuffle ? shuffled(labels) : labels).forEach(l => box.append(l));
      getOk = () => q.answers.every((a, i) => inputs[i].checked === !!a.correct);
    }
    box.append(fb); qs.push({ box, getOk, q });
    wrap.append(box);
  });
  return { node: wrap, check() {
    let c = 0;
    qs.forEach(({ box, getOk, q }) => {
      const ok = getOk(); if (ok) c++; setMark(box, ok);
      const fb = box.querySelector('.fb');
      fb.textContent = ok ? '' : 'Respuesta correcta: ' + q.answers.filter(a => a.correct).map(a => a.text).join(' / ') + (q.explain ? ' — ' + q.explain : '');
    });
    return { correct: c, total: qs.length };
  } };
}

function renderMatch(ex) {
  const { items, options } = ex.data; const rows = [];
  const tb = h('tbody');
  items.forEach((it, i) => {
    const sel = h('select', { 'aria-label': it.left }, h('option', { value: '' }, '???'), options.map(o => h('option', { value: o }, o)));
    const mk = h('td');
    tb.append(h('tr', {}, h('td', {}, it.left), h('td', {}, sel), mk));
    rows.push({ it, sel, mk });
  });
  return { node: h('table', { class: 'match' }, tb), check() {
    let c = 0;
    rows.forEach(({ it, sel, mk }) => {
      const ok = it.correct.includes(sel.value); if (ok) c++;
      mk.textContent = ok ? '✔' : '✘ Correcta: ' + it.correct.join(' / '); mk.className = 'mark ' + (ok ? 'ok' : 'ko');
    });
    return { correct: c, total: rows.length };
  } };
}

function renderCloze(ex) {
  const { text, gaps, caseSensitive, wordList } = ex.data; const fields = [];
  const box = h('div', { class: 'cloze' });
  text.split(/(\{\{\d+\}\})/).forEach(part => {
    const m = part.match(/^\{\{(\d+)\}\}$/);
    if (!m) { box.append(part); return; }
    const gap = gaps.find(g => g.n === +m[1]);
    const inp = h('input', { type: 'text', 'aria-label': `Hueco ${gap.n}`, title: gap.hint || '', autocomplete: 'off' });
    const rv = h('span', { class: 'fb' }); fields.push({ inp, gap, rv }); box.append(inp, rv);
  });
  const node = h('div');
  if (wordList && wordList.length) node.append(h('p', { class: 'fb' }, 'Palabras: ' + wordList.join(' · ')));
  node.append(box);
  return { node, check() {
    let c = 0;
    fields.forEach(({ inp, gap, rv }) => {
      const ok = gap.answers.some(a => norm(a) === norm(inp.value));
      if (ok) c++; setMark(inp, ok);
      rv.textContent = ok ? '' : ' → ' + gap.answers.join(' / ');
    });
    return { correct: c, total: fields.length };
  } };
}

function renderCross(ex) {
  const { grid, across, down } = ex.data;
  const tb = h('tbody'); const inputs = {};
  const nums = {};
  [...across, ...down].forEach(w => { nums[w.row + ',' + w.col] = w.n; });
  grid.forEach((row, r) => {
    const tr = h('tr');
    row.forEach((ch, c) => {
      if (!ch) { tr.append(h('td')); return; }
      const inp = h('input', { type: 'text', maxlength: 1, 'aria-label': `Fila ${r + 1}, columna ${c + 1}` });
      inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase(); });
      const td = h('td', { class: 'cell' }, inp);
      if (nums[r + ',' + c]) td.append(h('span', { class: 'n' }, String(nums[r + ',' + c])));
      inputs[r + ',' + c] = { td, inp, ch }; tr.append(td);
    });
    tb.append(tr);
  });
  const clues = (title, list) => h('div', {}, h('h4', {}, title), h('ol', { class: 'clues' }, list.map(w => h('li', { value: w.n }, w.clue))));
  const rvx = h('div', { class: 'fb' });
  const node = h('div', {}, rvx, h('div', { class: 'grid-wrap' }, h('table', { class: 'grid' }, tb)), clues('Horizontales', across), clues('Verticales', down));
  const words = [...across.map(w => ({ ...w, dr: 0, dc: 1 })), ...down.map(w => ({ ...w, dr: 1, dc: 0 }))];
  return { node, check() {
    let c = 0; const bad = new Set(); const miss = [];
    words.forEach(w => {
      const cells = [...w.answer].map((_, i) => inputs[(w.row + w.dr * i) + ',' + (w.col + w.dc * i)]);
      const ok = cells.every((x, i) => x && x.inp.value.toUpperCase() === w.answer[i]);
      if (ok) c++; else { miss.push(w.n + (w.dr ? '↓ ' : '→ ') + w.answer); cells.forEach(x => x && bad.add(x)); }
    });
    Object.values(inputs).forEach(x => { x.td.classList.remove('ok', 'ko'); x.td.classList.add(bad.has(x) ? 'ko' : (x.inp.value ? 'ok' : 'ko')); });
    rvx.textContent = miss.length ? 'Respuestas correctas de las palabras falladas: ' + miss.join(' · ') : '';
    return { correct: c, total: words.length };
  } };
}

const RENDER = { quiz: renderQuiz, match: renderMatch, cloze: renderCloze, cross: renderCross };

// ---------- Scoring ----------
// Puntaje = (aciertos − intentos fallidos previos) / total × 100, como en Hot Potatoes.
function scoreOf(correct, total, fails) { return Math.max(0, Math.round(100 * (correct - fails) / total)); }
const cls = s => s >= 80 ? 'good' : s < 50 ? 'bad' : '';

// ---------- UI ----------
let currentId = EX[0].id;
function renderMenu() {
  const menu = $('#menu'); menu.replaceChildren();
  let ch = null;
  EX.forEach(ex => {
    if (ex.chapter !== ch) { ch = ex.chapter; menu.append(h('h3', {}, ch >= 90 ? 'Examen de refuerzo' : `Capítulo ${ch}`)); }
    const p = progress[ex.id];
    menu.append(h('button', { class: ex.id === currentId ? 'on' : '', onclick: () => { currentId = ex.id; show(); } },
      h('span', {}, `${ex.id}. ${ex.title}`),
      h('span', { class: 'sc ' + (p ? cls(p.best) : '') }, p ? p.best + '%' : '–')));
  });
}
function renderTotal() {
  const MAIN = EX.filter(e => e.chapter < 90);
  const done = MAIN.filter(e => progress[e.id]).length;
  const avg = Math.round(MAIN.reduce((a, e) => a + (progress[e.id]?.best || 0), 0) / MAIN.length);
  const parts = [];
  const chs = [...new Set(MAIN.map(e => e.chapter))];
  chs.forEach(c => {
    const l = MAIN.filter(e => e.chapter === c);
    parts.push(`Cap. ${c}: ${Math.round(l.reduce((a, e) => a + (progress[e.id]?.best || 0), 0) / l.length)}%`);
  });
  const t = $('#total'); t.textContent = `Puntaje total: ${avg}% · ${done}/${MAIN.length} intentados`; t.title = parts.join('  |  ');
}
function show() {
  const ex = EX.find(e => e.id === currentId); const main = $('#main'); main.replaceChildren();
  let fails = 0, locked = false;
  const r = RENDER[ex.type](ex);
  const res = h('div', { 'aria-live': 'polite' });
  const prog = progress[ex.id];
  main.append(h('h2', {}, `Ejercicio ${ex.id} · ${ex.title}`));
  if (ex.subtitle) main.append(h('p', { class: 'sub' }, ex.subtitle));
  (ex.images || []).forEach(f => {
    const img = h('img', { src: 'images/' + encodeURIComponent(f), alt: f, style: 'max-width:100%;display:block;margin:8px 0' });
    img.addEventListener('error', () => img.replaceWith(h('a', { class: 'imgref', href: IMG_LINKS[f] || '#', target: '_blank', rel: 'noopener' }, '🖼 Ver imagen del ejercicio: ' + f)));
    main.append(img);
  });
  if (ex.instructions) main.append(h('div', { class: 'ins' }, ex.instructions));
  main.append(r.node);
  const check = h('button', { class: 'p', onclick: () => {
    if (locked) return;
    const { correct, total } = r.check();
    const score = scoreOf(correct, total, ex.noPenalty ? 0 : fails);
    const p = progress[ex.id] || { best: 0, attempts: 0 };
    p.attempts++; p.last = score; p.best = Math.max(p.best, score); progress[ex.id] = p; save();
    const all = correct === total;
    res.replaceChildren(h('div', { class: 'result ' + (all ? 'good' : 'bad') },
      `Correctas: ${correct}/${total} · Puntaje: ${score}%` + (fails && !ex.noPenalty ? ` (−${fails} por intentos fallidos)` : '') +
      (all ? ' — ¡Correcto! Bien hecho.' : ' — Hay respuestas incorrectas, marcadas con ✘. Inténtalo nuevamente.')));
    if (all) { locked = true; check.disabled = true; } else fails++;
    renderMenu(); renderTotal();
  } }, 'Comprobar respuestas');
  const retry = h('button', { class: 's', onclick: show }, 'Reiniciar ejercicio');
  main.append(h('div', { class: 'actions' }, check, retry,
    prog ? h('span', { class: 'fb' }, `Mejor puntaje: ${prog.best}% · Intentos: ${prog.attempts}`) : ''), res);
  renderMenu();
}
let armed = false;
const reset = h('button', { class: 's', onclick: () => {
  if (!armed) { armed = true; reset.textContent = 'Confirmar: borrar todo'; setTimeout(() => { armed = false; reset.textContent = 'Borrar progreso'; }, 4000); return; }
  armed = false; reset.textContent = 'Borrar progreso'; progress = {}; save(); show(); renderTotal();
} }, 'Borrar progreso');
document.querySelector('.top').append(reset);
renderTotal(); show();
})();
</script>
